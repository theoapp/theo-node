version: '3.8'

services:
  mysql-server-1:
    image: ${MYSQLSERVER_IMAGE}
    command:
      - "mysqld"
      - "--server_id=1"
      - "--binlog_checksum=NONE"
      - "--gtid_mode=ON"
      - "--enforce_gtid_consistency=ON"
      - "--log_bin"
      - "--log_slave_updates=ON"
      - "--master_info_repository=TABLE"
      - "--relay_log_info_repository=TABLE"
      - "--transaction_write_set_extraction=XXHASH64"
      - "--user=mysql"
      - "--skip-host-cache"
      - "--skip-name-resolve"
      - "--tls-version="
      - "--default_authentication_plugin=mysql_native_password"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
  mysql-server-2:
    image: ${MYSQLSERVER_IMAGE}
    command:
      - "mysqld"
      - "--server_id=2"
      - "--binlog_checksum=NONE"
      - "--gtid_mode=ON"
      - "--enforce_gtid_consistency=ON"
      - "--log_bin"
      - "--log_slave_updates=ON"
      - "--master_info_repository=TABLE"
      - "--relay_log_info_repository=TABLE"
      - "--transaction_write_set_extraction=XXHASH64"
      - "--user=mysql"
      - "--skip-host-cache"
      - "--skip-name-resolve"
      - "--tls-version="
      - "--default_authentication_plugin=mysql_native_password"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
  mysql-server-3:
    image: ${MYSQLSERVER_IMAGE}
    command:
      - "mysqld"
      - "--server_id=3"
      - "--binlog_checksum=NONE"
      - "--gtid_mode=ON"
      - "--enforce_gtid_consistency=ON"
      - "--log_bin"
      - "--log_slave_updates=ON"
      - "--master_info_repository=TABLE"
      - "--relay_log_info_repository=TABLE"
      - "--transaction_write_set_extraction=XXHASH64"
      - "--user=mysql"
      - "--skip-host-cache"
      - "--skip-name-resolve"
      - "--tls-version="
      - "--default_authentication_plugin=mysql_native_password"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
  mysql-shell:
    image: neumayer/mysql-shell-batch
    volumes:
      - ./scripts/:/scripts/
    depends_on:
      mysql-server-1:
        condition: service_healthy
      mysql-server-2:
        condition: service_healthy
      mysql-server-3:
        condition: service_healthy
    environment:
      MYSQL_USER: root
      MYSQL_HOST: mysql-server-1
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQLSH_SCRIPT: /scripts/setupCluster.js
      MYSQL_SCRIPT: /scripts/db.sql
  cache:
    image: ${REDIS_IMAGE}
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 30s
      retries: 3
  theo1:
    image: theo:test
    container_name: theo1
    restart: always
    environment:
      MODE: test
      LOG_LEVEL: debug
      DB_ENGINE: mariadb
      DB_CLUSTER: rw:mysql-server-1:3306,ro:mysql-server-2:3306,ro:mysql-server-2:3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      CORE_TOKEN: ${CORE_TOKEN}
      CACHE_ENABLED: redis
      CACHE_URI: redis://cache:6379
      CLUSTER_MODE: 1
      DB_CONN_MAX_RETRY: 30
      SKIP_UPDATECHECK: 1
    depends_on:
      mysql-shell:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
  theo2:
    image: theo:test
    container_name: theo2
    restart: always
    environment:
      MODE: test
      LOG_LEVEL: debug
      DB_ENGINE: mariadb
      DB_CLUSTER: rw:mysql-server-1:3306,ro:mysql-server-2:3306,ro:mysql-server-2:3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      CORE_TOKEN: ${CORE_TOKEN}
      CACHE_ENABLED: redis
      CACHE_URI: redis://cache:6379
      CLUSTER_MODE: 1
      DB_CONN_MAX_RETRY: 30
      SKIP_UPDATECHECK: 1
    depends_on:
      mysql-shell:
        condition: service_completed_successfully
      cache:
        condition: service_healthy
  theo3:
    image: theo:test
    container_name: theo3
    restart: always
    environment:
      MODE: test
      LOG_LEVEL: debug
      DB_ENGINE: mariadb
      DB_CLUSTER: rw:mysql-server-1:3306,ro:mysql-server-2:3306,ro:mysql-server-2:3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      CORE_TOKEN: ${CORE_TOKEN}
      CACHE_ENABLED: redis
      CACHE_URI: redis://cache:6379
      CLUSTER_MODE: 1
      DB_CONN_MAX_RETRY: 30
      SKIP_UPDATECHECK: 1
    depends_on:
      mysql-shell:
        condition: service_completed_successfully
      cache:
        condition: service_healthy

