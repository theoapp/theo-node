version: '3.8'

services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: pg_isready -d ${POSTGRES_DB}
      interval: 10s
      timeout: 60s
      retries: 10
      start_period: 80s
  cache:
    image: ${REDIS_IMAGE}
    healthcheck:
      test: redis-cli ping
      interval: 30s
      timeout: 30s
      retries: 3
  theo:
    image: theo:test
    container_name: theo
    environment:
      MODE: test
      DB_ENGINE: postgres
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CLIENT_TOKENS: ${CLIENT_TOKENS}
      CACHE_ENABLED: redis
      CACHE_URI: redis://cache:6379
      DB_CONN_MAX_RETRY: 30
      SKIP_UPDATECHECK: 1
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
