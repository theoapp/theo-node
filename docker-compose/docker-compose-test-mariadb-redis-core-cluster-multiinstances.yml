---
services:
  db:
    image: ${MARIADB_IMAGE}
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    healthcheck:
      test: mariadb-admin -u root -p${MARIADB_ROOT_PASSWORD} status
      interval: 10s
      timeout: 10s
      retries: 10
  cache:
    image: ${REDIS_IMAGE}
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 10s
      retries: 10
  theo:
    image: theo:test
    deploy:
      replicas: 3
    healthcheck:
      test: node build/healthcheck.js
      interval: 5s
      timeout: 1s
      retries: 12
    environment:
      MODE: test
      REQUIRE_SIGNED_KEY: 1
      DB_ENGINE: mariadb
      DB_HOST: db
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}
      DB_NAME: ${MARIADB_DATABASE}
      CORE_TOKEN: ${CORE_TOKEN}
      CACHE_ENABLED: redis
      CACHE_URI: redis://cache:6379
      CLUSTER_MODE: 1
      DB_CONN_MAX_RETRY: 30
      SKIP_UPDATECHECK: 1
      MULTI_INSTANCES: 1
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
