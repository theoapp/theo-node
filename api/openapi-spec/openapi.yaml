openapi: "3.0.3"
info:
  title: "Theo"
  version: "2.0.9"
  description: |
    Theo node - The Authorized Keys Manager. You can find out more about Theo at [https://github.com/theoapp/](https://github.com/theoapp/).

    ### Authentication
    Every request, but `/`, `/healthz`, authenticates with a bearer token (`Authorization: Bearer <token>`):
    - **client** tokens can only read `/authorized_keys`
    - **admin** tokens can use every admin endpoint (and `/authorized_keys`)
    - **core** token (core mode, `CORE_TOKEN`) can also manage tokens. It may send `X-On-Behalf-Of` to act on behalf of another token.

    ### Multi instances
    When the server runs with `MULTI_INSTANCES=1` every request is bound to the instance named after the request
    hostname (`Host` header): accounts, groups, keys, permissions and tokens of different instances are isolated.

    ### Ids
    Wherever an account is identified by `{id}` its email can be used too; wherever a group is identified by `{id}` its name can be used too.
  contact:
    email: "team@authkeys.io"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
servers:
  - url: http://localhost:9100
    description: Local theo server
  - url: https://theo.test.authkeys.io
    description: Public UNTRUSTABLE test theo server
tags:
  - name: "utils"
    description: "Utils methods"
  - name: "tokens"
    description: "Tokens management (core mode)"
  - name: "authorized_keys"
    description: "Public keys lookup used by sshd AuthorizedKeysCommand"
  - name: "account"
    description: "Everything about accounts"
  - name: "keys"
    description: "Everything about accounts' public keys"
  - name: "permissions"
    description: "Everything about permissions"
  - name: "groups"
    description: "Everything about groups"
  - name: "impexp"
    description: "Export and import of the whole database"
paths:
  /:
    get:
      tags:
        - "utils"
      summary: "Get server name and description"
      x-eov-operation-handler: MainController
      operationId: getInfo
      security: []
      responses:
        200:
          description: "Server info"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "name"
                  - "description"
                properties:
                  name:
                    type: "string"
                    example: "theo"
                  description:
                    type: "string"
                    example: "Theo is your AuthorizedKeys manager"
  /healthz:
    get:
      tags:
        - "utils"
      summary: "Health check"
      x-eov-operation-handler: MainController
      operationId: healthCheck
      security: []
      responses:
        200:
          description: "Server is up"
          content:
            text/plain:
              schema:
                type: "string"
                example: "OK"
  /uptime:
    get:
      tags:
        - "utils"
      summary: "Get server version and uptime"
      x-eov-operation-handler: MainController
      operationId: getUptime
      security:
        - bearerTokenAdmin: []
      responses:
        200:
          description: "Server uptime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Uptime"
        401:
          $ref: "#/components/responses/Unauthorized"
  /flushdb:
    post:
      tags:
        - "utils"
      summary: "Flush all databases and cache. It's enabled ONLY when server runs in TEST mode"
      x-eov-operation-handler: MainController
      operationId: flushDB
      security:
        - bearerTokenAdmin: []
      responses:
        204:
          description: "Db flushed"
        401:
          $ref: "#/components/responses/Unauthorized"
        403:
          description: "Even if authenticated, the operation is forbidden (server is NOT RUNNING in TEST mode)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenErrorResponse"
        404:
          description: "Nothing flushed"
        500:
          description: "Error"
  /tokens:
    post:
      tags:
        - "tokens"
      summary: "Replace all the tokens of the instance"
      x-eov-operation-handler: TokensController
      operationId: replaceTokens
      security:
        - bearerTokenCore: []
      requestBody:
        description: "New tokens. At least one between core, admin, admins and clients is required."
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "tokens"
              properties:
                tokens:
                  $ref: "#/components/schemas/Tokens"
      responses:
        204:
          description: "Tokens replaced"
        400:
          description: "Invalid payload"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
    delete:
      tags:
        - "tokens"
      summary: "Delete all the tokens of the instance"
      x-eov-operation-handler: TokensController
      operationId: deleteTokens
      security:
        - bearerTokenCore: []
      responses:
        204:
          description: "Tokens deleted"
        401:
          $ref: "#/components/responses/Unauthorized"
  /all:
    delete:
      tags:
        - "utils"
      summary: "Delete accounts, groups and tokens of the instance. Available only when MULTI_INSTANCES=1"
      x-eov-operation-handler: MainController
      operationId: deleteInstance
      security:
        - bearerTokenCore: []
      responses:
        200:
          description: "Instance deleted"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "status"
                  - "message"
                properties:
                  status:
                    type: "integer"
                    format: "int32"
                    example: 200
                  message:
                    type: "string"
                    example: "instance deleted"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          description: "Server is not running with MULTI_INSTANCES=1"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeErrorResponse"
  /authorized_keys/{host}/{user}:
    get:
      tags:
        - "authorized_keys"
      summary: "Get the public keys allowed to login as user on host"
      x-eov-operation-handler: AuthorizedKeysController
      operationId: getAuthorizedKeys
      security:
        - bearerTokenClient: []
        - bearerTokenAdmin: []
        - bearerTokenCore: []
      parameters:
        - $ref: "#/components/parameters/Host"
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Fingerprint"
        - $ref: '#/components/parameters/RemoteConnection'
        - $ref: "#/components/parameters/AcceptAuthorizedKeys"
      responses:
        200:
          $ref: "#/components/responses/AuthorizedKeys"
        401:
          $ref: "#/components/responses/Unauthorized"
        406:
          description: "Keys must be requested as application/json when REQUIRE_SIGNED_KEY is set"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          $ref: "#/components/responses/Error"
  /authorized_keys/{user}:
    get:
      tags:
        - "authorized_keys"
      summary: "Get the public keys allowed to login as user on the host making the request (resolved by reverse DNS)"
      x-eov-operation-handler: AuthorizedKeysController
      operationId: getAuthorizedKeysByReverseDNS
      security:
        - bearerTokenClient: []
        - bearerTokenAdmin: []
        - bearerTokenCore: []
      parameters:
        - $ref: "#/components/parameters/User"
        - $ref: "#/components/parameters/Fingerprint"
        - $ref: '#/components/parameters/RemoteConnection'
        - $ref: "#/components/parameters/AcceptAuthorizedKeys"
      responses:
        200:
          $ref: "#/components/responses/AuthorizedKeys"
        400:
          description: "Unable to resolve the hostname of the client"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          $ref: "#/components/responses/Unauthorized"
        406:
          description: "Keys must be requested as application/json when REQUIRE_SIGNED_KEY is set"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          $ref: "#/components/responses/Error"
  /permissions/{host}/{user}:
    get:
      tags:
        - "permissions"
      summary: "Get the accounts allowed to login as user on host, with the matching permissions"
      x-eov-operation-handler: PermissionsController
      operationId: searchPermissions
      security:
        - bearerTokenAdmin: []
      parameters:
        - $ref: "#/components/parameters/Host"
        - $ref: "#/components/parameters/User"
      responses:
        200:
          description: "Matching permissions"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PermissionMatch"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/Error"
  /accounts:
    get:
      tags:
        - "account"
      summary: "Retrieve accounts"
      x-eov-operation-handler: AccountsController
      operationId: listAccounts
      security:
        - bearerTokenAdmin: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: "search"
          in: "query"
          description: "Search by name or email (substring match)"
          required: false
          schema:
            type: "string"
            example: "mac"
        - $ref: "#/components/parameters/AccountOrderBy"
        - $ref: "#/components/parameters/Sort"
      responses:
        200:
          description: "List of accounts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsList"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - "account"
      summary: "Create a new account"
      x-eov-operation-handler: AccountsController
      operationId: addAccount
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "Account to add"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountNew"
      responses:
        200:
          description: "The new account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        409:
          $ref: "#/components/responses/Conflict"
        500:
          $ref: "#/components/responses/Error"
  /accounts/search:
    get:
      tags:
        - "account"
      summary: "Search accounts"
      x-eov-operation-handler: AccountsController
      operationId: searchAccounts
      security:
        - bearerTokenAdmin: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: "search"
          in: "query"
          description: "Default value for both name and email"
          required: false
          schema:
            type: "string"
            example: "mac"
        - name: "name"
          in: "query"
          description: "Search by name (substring match)"
          required: false
          schema:
            type: "string"
            example: "mac"
        - name: "email"
          in: "query"
          description: "Search by email (substring match)"
          required: false
          schema:
            type: "string"
            example: "@authkeys.io"
      responses:
        200:
          description: "List of accounts"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsList"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/Error"
  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags:
        - "account"
      summary: "Get an account"
      x-eov-operation-handler: AccountsController
      operationId: getAccount
      security:
        - bearerTokenAdmin: []
      responses:
        200:
          description: "Account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - "account"
      summary: "Edit an account"
      x-eov-operation-handler: AccountsController
      operationId: editAccount
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "Fields to edit, at least one is required"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEdit"
      responses:
        201:
          $ref: "#/components/responses/Done"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - "account"
      summary: "Delete an account"
      x-eov-operation-handler: AccountsController
      operationId: deleteAccount
      security:
        - bearerTokenAdmin: []
      responses:
        201:
          $ref: "#/components/responses/Done"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /accounts/{id}/keys:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags:
        - "account"
        - "keys"
      summary: "Add public keys to an account"
      x-eov-operation-handler: AccountsController
      operationId: addKeysToAccount
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "New key(s) to add. When REQUIRE_SIGNED_KEY is set every key must be an object with its signature."
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "keys"
              properties:
                keys:
                  type: "array"
                  items:
                    $ref: "#/components/schemas/PublicKeyNewItem"
      responses:
        200:
          description: "Added keys"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedKeysResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        409:
          description: "The key already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          $ref: "#/components/responses/Error"
  /accounts/{id}/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - name: "key_id"
        in: "path"
        description: "Public key ID"
        required: true
        schema:
          type: "integer"
          format: "int64"
    put:
      tags:
        - "account"
        - "keys"
      summary: "Set the ssh options of a public key"
      x-eov-operation-handler: AccountsController
      operationId: editAccountKey
      security:
        - bearerTokenAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHOptionsEdit"
      responses:
        201:
          $ref: "#/components/responses/Done"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - "account"
        - "keys"
      summary: "Delete a public key from an account"
      x-eov-operation-handler: AccountsController
      operationId: deleteKeyFromAccount
      security:
        - bearerTokenAdmin: []
      responses:
        201:
          $ref: "#/components/responses/Done"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /accounts/{id}/keys/import/{service}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - name: "service"
        in: "path"
        description: "Service to fetch the keys from"
        required: true
        schema:
          type: "string"
          enum:
            - "github"
            - "gitlab"
    post:
      tags:
        - "account"
        - "keys"
      summary: "Add public keys to an account loading them from an external service. Not available when REQUIRE_SIGNED_KEY is set. Keys already present are skipped."
      x-eov-operation-handler: AccountsController
      operationId: addKeysFromServiceToAccount
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "Username to fetch"
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "username"
              properties:
                username:
                  type: "string"
                  example: "macno"
      responses:
        200:
          description: "Added keys"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedKeysResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /accounts/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags:
        - "account"
        - "permissions"
      summary: "Add a permission to an account"
      x-eov-operation-handler: AccountsController
      operationId: addPermissionToAccount
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "New permission to add"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionNew"
      responses:
        200:
          description: "Permission added"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "account_id"
                  - "permission_id"
                properties:
                  account_id:
                    type: "integer"
                    format: "int64"
                    example: 324
                  permission_id:
                    type: "integer"
                    format: "int64"
                    example: 435
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /accounts/{id}/permissions/{permission_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - $ref: "#/components/parameters/PermissionId"
    put:
      tags:
        - "account"
        - "permissions"
      summary: "Set the ssh options of an account permission"
      x-eov-operation-handler: AccountsController
      operationId: editAccountPermission
      security:
        - bearerTokenAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHOptionsEdit"
      responses:
        201:
          $ref: "#/components/responses/Done"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - "account"
        - "permissions"
      summary: "Delete a permission from an account"
      x-eov-operation-handler: AccountsController
      operationId: deletePermissionFromAccount
      security:
        - bearerTokenAdmin: []
      responses:
        201:
          $ref: "#/components/responses/Done"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /groups:
    get:
      tags:
        - "groups"
      summary: "Retrieve groups (internal account groups are not listed)"
      x-eov-operation-handler: GroupsController
      operationId: listGroups
      security:
        - bearerTokenAdmin: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: "name"
          in: "query"
          description: "Search by name (substring match)"
          required: false
          schema:
            type: "string"
            example: "dev"
        - $ref: "#/components/parameters/GroupOrderBy"
        - $ref: "#/components/parameters/Sort"
      responses:
        200:
          description: "List of groups"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsList"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - "groups"
      summary: "Create a new group"
      x-eov-operation-handler: GroupsController
      operationId: addGroup
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "Group's name to create"
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "name"
              properties:
                name:
                  type: "string"
                  example: "Developers"
      responses:
        200:
          description: "The new group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        409:
          $ref: "#/components/responses/Conflict"
        500:
          $ref: "#/components/responses/Error"
  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      tags:
        - "groups"
      summary: "Retrieve a group"
      x-eov-operation-handler: GroupsController
      operationId: getGroup
      security:
        - bearerTokenAdmin: []
      responses:
        200:
          description: "Group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - "groups"
      summary: "DEPRECATED: Use /groups/{id}/account(s). Add account(s) to a group"
      x-eov-operation-handler: GroupsController
      operationId: deprecatedAddAccountsToGroup
      deprecated: true
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "Account(s) to add to the group: only one between id and ids"
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AccountId"
                - $ref: "#/components/schemas/AccountIds"
      responses:
        200:
          description: "Result for each account (when ids is used)"
          headers:
            X-Sunset:
              $ref: "#/components/headers/X-Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupAccountsResults"
        204:
          description: "Account added to the group (when id is used)"
          headers:
            X-Sunset:
              $ref: "#/components/headers/X-Sunset"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    put:
      tags:
        - "groups"
      summary: "Enable or disable a group"
      x-eov-operation-handler: GroupsController
      operationId: editGroup
      security:
        - bearerTokenAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "active"
              properties:
                active:
                  $ref: "#/components/schemas/ActiveInput"
      responses:
        201:
          $ref: "#/components/responses/Done"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - "groups"
      summary: "Delete a group"
      x-eov-operation-handler: GroupsController
      operationId: deleteGroup
      security:
        - bearerTokenAdmin: []
      responses:
        201:
          $ref: "#/components/responses/Done"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /groups/{id}/account:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags:
        - "groups"
      summary: "Add an account to a group"
      x-eov-operation-handler: GroupsController
      operationId: addAccountToGroup
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "Account to add to the group"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountId"
      responses:
        204:
          description: "Account added to the group"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          description: "Entity not found (group or account)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        500:
          $ref: "#/components/responses/Error"
  /groups/{id}/accounts:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags:
        - "groups"
      summary: "Add accounts to a group"
      x-eov-operation-handler: GroupsController
      operationId: addAccountsToGroup
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "Accounts to add to the group"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountIds"
      responses:
        200:
          description: "Result for each account"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupAccountsResults"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /groups/{id}/{account_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: "account_id"
        in: "path"
        description: "Account ID or email"
        required: true
        schema:
          $ref: "#/components/schemas/Id"
    delete:
      tags:
        - "groups"
      summary: "Remove an account from a group"
      x-eov-operation-handler: GroupsController
      operationId: deleteAccountFromGroup
      security:
        - bearerTokenAdmin: []
      responses:
        204:
          description: "Account removed from the group"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          description: "Group or account not found, or account not in the group"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundErrorResponse"
        500:
          $ref: "#/components/responses/Error"
  /groups/{id}/permissions:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags:
        - "groups"
        - "permissions"
      summary: "Add a permission to a group"
      x-eov-operation-handler: GroupsController
      operationId: addPermissionToGroup
      security:
        - bearerTokenAdmin: []
      requestBody:
        description: "New permission to add"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionNew"
      responses:
        200:
          description: "Permission added"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "group_id"
                  - "permission_id"
                properties:
                  group_id:
                    type: "integer"
                    format: "int64"
                    example: 12
                  permission_id:
                    type: "integer"
                    format: "int64"
                    example: 435
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /groups/{id}/permissions/{permission_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/PermissionId"
    put:
      tags:
        - "groups"
        - "permissions"
      summary: "Set the ssh options of a group permission"
      x-eov-operation-handler: GroupsController
      operationId: editGroupPermission
      security:
        - bearerTokenAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SSHOptionsEdit"
      responses:
        201:
          $ref: "#/components/responses/Done"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - "groups"
        - "permissions"
      summary: "Delete a permission from a group"
      x-eov-operation-handler: GroupsController
      operationId: deletePermissionFromGroup
      security:
        - bearerTokenAdmin: []
      responses:
        201:
          $ref: "#/components/responses/Done"
        401:
          $ref: "#/components/responses/Unauthorized"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Error"
  /impexp:
    get:
      tags:
        - "impexp"
      summary: "Export accounts and groups"
      x-eov-operation-handler: ImpExpController
      operationId: exportData
      security:
        - bearerTokenAdmin: []
      responses:
        200:
          description: "Dump"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dump"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - "impexp"
      summary: "Import a dump created by GET /impexp"
      x-eov-operation-handler: ImpExpController
      operationId: importData
      security:
        - bearerTokenAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Dump"
      responses:
        204:
          description: "Dump imported"
        401:
          $ref: "#/components/responses/Unauthorized"
        500:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerTokenCore:
      type: http
      scheme: bearer
      description: "Core token (CORE_TOKEN)"
    bearerTokenAdmin:
      type: http
      scheme: bearer
      description: "Admin token (or core token)"
    bearerTokenClient:
      type: http
      scheme: bearer
      description: "Client (agent) token"
  headers:
    X-Sunset:
      description: "Version in which the deprecated endpoint will be removed"
      schema:
        type: "string"
        example: "1.0.0"
    X-From-Cache:
      description: "Whether the keys were served from the cache"
      schema:
        type: "string"
        enum:
          - "true"
          - "false"
  parameters:
    AccountId:
      name: "id"
      in: "path"
      description: "Account ID or email"
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    GroupId:
      name: "id"
      in: "path"
      description: "Group ID or name"
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    PermissionId:
      name: "permission_id"
      in: "path"
      description: "Permission ID"
      required: true
      schema:
        type: "integer"
        format: "int64"
    Host:
      name: "host"
      in: "path"
      required: true
      schema:
        type: "string"
        example: "server1.example.com"
    User:
      name: "user"
      in: "path"
      required: true
      schema:
        type: "string"
        example: "root"
    Fingerprint:
      name: "f"
      in: "query"
      description: "Fingerprint of the key being used: when it matches, the key last_used_at is updated (application/json only)"
      required: false
      allowReserved: true
      schema:
        type: "string"
        example: "SHA256:FcVOofKlyFRbcrq5zfQH6ipEFwGEZ3hG0iydwWl6TLU"
    RemoteConnection:
      name: "c"
      in: "query"
      description: "Remote connection IP address"
      required: false
      allowReserved: true
      schema:
        type: "string"
        example: "192.168.1.1 or fe80::1"
    AcceptAuthorizedKeys:
      name: "Accept"
      in: "header"
      description: "When it contains application/json the keys are returned as JSON (required when REQUIRE_SIGNED_KEY is set), otherwise as authorized_keys text"
      required: false
      schema:
        type: "string"
        example: "application/json"
    Limit:
      name: "limit"
      in: "query"
      description: "Number of items to retrieve"
      required: false
      schema:
        type: "integer"
        format: "int32"
        minimum: 1
        maximum: 100
        default: 10
    Offset:
      name: "offset"
      in: "query"
      description: "Offset of the list"
      required: false
      schema:
        type: "integer"
        format: "int32"
        minimum: 0
        default: 0
    AccountOrderBy:
      name: "order_by"
      in: "query"
      description: "Field to sort the accounts by"
      required: false
      schema:
        type: "string"
        enum:
          - "id"
          - "name"
          - "email"
          - "active"
          - "expire_at"
          - "created_at"
        default: "name"
    GroupOrderBy:
      name: "order_by"
      in: "query"
      description: "Field to sort the groups by"
      required: false
      schema:
        type: "string"
        enum:
          - "id"
          - "name"
          - "active"
          - "created_at"
        default: "name"
    Sort:
      name: "sort"
      in: "query"
      description: "Sort direction"
      required: false
      schema:
        type: "string"
        enum:
          - "asc"
          - "desc"
        default: "asc"
  responses:
    Done:
      description: "Done"
      content:
        application/json:
          schema:
            type: "object"
            required:
              - "status"
            properties:
              status:
                type: "integer"
                format: "int32"
                example: 201
    AuthorizedKeys:
      description: "Allowed public keys"
      headers:
        X-From-Cache:
          $ref: "#/components/headers/X-From-Cache"
      content:
        text/plain:
          schema:
            type: "string"
            description: "authorized_keys file content: one key per line, prefixed by its ssh options"
            example: "from=\"10.0.0.1\" ssh-rsa AAA[...]xv macno@laptop"
        application/json:
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/AuthorizedKey"
    BadRequest:
      description: "Invalid payload or parameters"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidPayloadErrorResponse"
    Unauthorized:
      description: "Missing or invalid token"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedErrorResponse"
    NotFound:
      description: "Item not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundErrorResponse"
    Conflict:
      description: "Item already exists"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error:
      description: "Error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Id:
      anyOf:
        - type: "integer"
          format: "int64"
          example: 251
        - type: "string"
          example: "macno@authkeys.io"
    Ids:
      type: "array"
      items:
        $ref: "#/components/schemas/Id"
    Active:
      type: "integer"
      format: "int32"
      example: 1
      enum:
        - 0
        - 1
    ActiveInput:
      description: "Boolean or 0/1"
      oneOf:
        - type: "boolean"
        - type: "integer"
          enum:
            - 0
            - 1
    Timestamp:
      description: "Milliseconds since epoch"
      type: "integer"
      format: "int64"
      example: 1539688358693
    ExpireAt:
      description: "Expiration as milliseconds since epoch, 0 means never"
      type: "integer"
      format: "int64"
      example: 0
    ExpireAtInput:
      description: "Expiration as milliseconds since epoch or ISO 8601 string. 0, null or an empty string mean never"
      oneOf:
        - type: "integer"
          format: "int64"
          nullable: true
          example: 1893456000000
        - type: "string"
          example: "2030-01-01T00:00:00Z"
    SSHOptions:
      type: "object"
      description: "ssh options rendered in front of the key in authorized_keys"
      properties:
        from:
          type: "array"
          items:
            type: "string"
          example:
            - "10.0.0.0/8"
        permitopen:
          type: "array"
          items:
            type: "string"
        environment:
          type: "array"
          items:
            type: "string"
        command:
          type: "string"
        restrict:
          type: "boolean"
        agent-forwarding:
          type: "boolean"
        no-agent-forwarding:
          type: "boolean"
        port-forwarding:
          type: "boolean"
        no-port-forwarding:
          type: "boolean"
        pty:
          type: "boolean"
        no-pty:
          type: "boolean"
        user-rc:
          type: "boolean"
        no-user-rc:
          type: "boolean"
        X11-forwarding:
          type: "boolean"
        no-X11-forwarding:
          type: "boolean"
    StoredSSHOptions:
      description: "ssh options, false when not set"
      oneOf:
        - $ref: "#/components/schemas/SSHOptions"
        - type: "boolean"
          enum:
            - false
    SSHOptionsEdit:
      type: "object"
      required:
        - "ssh_options"
      properties:
        ssh_options:
          $ref: "#/components/schemas/SSHOptions"
    Tokens:
      type: "object"
      properties:
        core:
          type: "string"
          example: "j5jkl34h523hjlbnsdjgjhq45gh23fh"
        admin:
          description: "DEPRECATED: use admins. As string the assignee will be 'admin'"
          deprecated: true
          oneOf:
            - type: "string"
            - $ref: "#/components/schemas/AdminToken"
        admins:
          type: "array"
          items:
            oneOf:
              - type: "string"
                description: "DEPRECATED: the assignee will be md5(token)"
              - $ref: "#/components/schemas/AdminToken"
        clients:
          type: "array"
          items:
            type: "string"
            example: "j5jkl34h523hjlbnsdjgjhq45gh23fh"
    AdminToken:
      type: "object"
      required:
        - "token"
        - "assignee"
      properties:
        token:
          type: "string"
          example: "j5jkl34h523hjlbnsdjgjhq45gh23fh"
        assignee:
          type: "string"
          example: "macno"
    Uptime:
      type: "object"
      required:
        - "name"
        - "version"
        - "node_version"
        - "hostname"
        - "uptime"
        - "uptime_hr"
        - "memory_usage"
      properties:
        name:
          type: "string"
          example: "theo"
        version:
          type: "string"
          example: "2.0.9"
        node_version:
          type: "string"
          example: "v24.11.0"
        hostname:
          type: "string"
          example: "theo-1"
        uptime:
          description: "Seconds since start"
          type: "integer"
          format: "int64"
          example: 3600
        uptime_hr:
          type: "string"
          example: "1 hour"
        memory_usage:
          type: "string"
          example: "70M"
    AuthorizedKey:
      type: "object"
      required:
        - "public_key"
        - "public_key_sig"
        - "fingerprint"
        - "email"
        - "ssh_options"
      properties:
        public_key:
          type: "string"
          example: "ssh-rsa AAA[...]xv macno@laptop"
        public_key_sig:
          type: "string"
          nullable: true
          example: "XgRI6y3[...]S0ZFHN"
        fingerprint:
          type: "string"
          example: "SHA256:FcVOofKlyFRbcrq5zfQH6ipEFwGEZ3hG0iydwWl6TLU"
        email:
          type: "string"
          example: "macno@authkeys.io"
        ssh_options:
          description: "Rendered ssh options, empty string when not set"
          type: "string"
          example: "from=\"10.0.0.0/8\",no-pty"
    PermissionMatch:
      type: "object"
      required:
        - "id"
        - "email"
        - "host"
        - "user"
        - "ssh_options"
      properties:
        id:
          description: "Account ID"
          type: "integer"
          format: "int64"
        email:
          type: "string"
          example: "macno@authkeys.io"
        host:
          type: "string"
          example: "%.example.com"
        user:
          type: "string"
          example: "root"
        ssh_options:
          $ref: "#/components/schemas/StoredSSHOptions"
    BasicList:
      type: "object"
      required:
        - "total"
        - "limit"
        - "offset"
        - "rows"
      properties:
        total:
          type: "integer"
          format: "int32"
        limit:
          type: "integer"
          format: "int32"
        offset:
          type: "integer"
          format: "int32"
    AccountId:
      type: "object"
      required:
        - "id"
      properties:
        id:
          $ref: "#/components/schemas/Id"
    AccountIds:
      type: "object"
      required:
        - "ids"
      properties:
        ids:
          $ref: "#/components/schemas/Ids"
    AccountNew:
      type: "object"
      required:
        - "name"
        - "email"
      properties:
        name:
          type: "string"
          example: "Michele"
        email:
          type: "string"
          example: "macno@authkeys.io"
        active:
          $ref: "#/components/schemas/ActiveInput"
        expire_at:
          $ref: "#/components/schemas/ExpireAtInput"
        keys:
          type: "array"
          items:
            $ref: "#/components/schemas/PublicKeyNewItem"
    AccountEdit:
      type: "object"
      minProperties: 1
      properties:
        active:
          $ref: "#/components/schemas/ActiveInput"
        expire_at:
          $ref: "#/components/schemas/ExpireAtInput"
    AccountMinimal:
      type: "object"
      required:
        - "id"
        - "name"
        - "email"
        - "active"
        - "expire_at"
        - "created_at"
      properties:
        id:
          type: "integer"
          format: "int64"
          example: 251
        name:
          type: "string"
          example: "Michele"
        email:
          type: "string"
          example: "macno@authkeys.io"
        active:
          $ref: "#/components/schemas/Active"
        expire_at:
          $ref: "#/components/schemas/ExpireAt"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    Account:
      allOf:
        - $ref: "#/components/schemas/AccountMinimal"
        - type: "object"
          required:
            - "public_keys"
            - "groups"
            - "permissions"
          properties:
            public_keys:
              type: "array"
              items:
                $ref: "#/components/schemas/PublicKey"
            groups:
              type: "array"
              items:
                $ref: "#/components/schemas/AccountGroup"
            permissions:
              type: "array"
              items:
                $ref: "#/components/schemas/AccountPermission"
    AccountsList:
      allOf:
        - $ref: "#/components/schemas/BasicList"
        - type: "object"
          properties:
            rows:
              type: "array"
              items:
                $ref: "#/components/schemas/AccountMinimal"
    GroupMinimal:
      type: "object"
      required:
        - "id"
        - "name"
        - "active"
        - "created_at"
      properties:
        id:
          type: "integer"
          format: "int64"
          example: 12
        name:
          type: "string"
          example: "Developers"
        active:
          $ref: "#/components/schemas/Active"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AccountGroup:
      allOf:
        - $ref: "#/components/schemas/GroupMinimal"
        - type: "object"
          required:
            - "is_internal"
          properties:
            is_internal:
              description: "1 for the account's own group (named after its email)"
              allOf:
                - $ref: "#/components/schemas/Active"
    Group:
      allOf:
        - $ref: "#/components/schemas/GroupMinimal"
        - type: "object"
          required:
            - "accounts"
            - "permissions"
          properties:
            accounts:
              type: "array"
              items:
                $ref: "#/components/schemas/AccountMinimal"
            permissions:
              type: "array"
              items:
                $ref: "#/components/schemas/Permission"
    GroupsList:
      allOf:
        - $ref: "#/components/schemas/BasicList"
        - type: "object"
          properties:
            rows:
              type: "array"
              items:
                $ref: "#/components/schemas/GroupMinimal"
    GroupAccountsResults:
      type: "array"
      items:
        type: "object"
        required:
          - "status"
          - "account"
        properties:
          status:
            type: "integer"
            format: "int32"
            example: 404
          account:
            $ref: "#/components/schemas/Id"
          reason:
            type: "string"
            example: "Account not found"
    PublicKeyNew:
      type: "object"
      required:
        - "key"
      properties:
        key:
          type: "string"
          example: "ssh-rsa AAA[...]xv macno@laptop"
        signature:
          type: "string"
          example: "XgRI6y3[...]S0ZFHN"
        ssh_options:
          $ref: "#/components/schemas/SSHOptions"
    PublicKeyNewItem:
      oneOf:
        - type: "string"
          example: "ssh-rsa AAA[...]xv macno@laptop"
        - $ref: "#/components/schemas/PublicKeyNew"
    PublicKey:
      type: "object"
      required:
        - "id"
        - "public_key"
        - "fingerprint"
        - "public_key_sig"
        - "key_ssh_options"
        - "last_used_at"
        - "created_at"
      properties:
        id:
          type: "integer"
          format: "int64"
          example: 35
        public_key:
          type: "string"
          example: "ssh-rsa AAA[...]xv macno@laptop"
        fingerprint:
          type: "string"
          example: "SHA256:FcVOofKlyFRbcrq5zfQH6ipEFwGEZ3hG0iydwWl6TLU"
        public_key_sig:
          type: "string"
          nullable: true
          example: "XgRI6y3[...]S0ZFHN"
        key_ssh_options:
          $ref: "#/components/schemas/StoredSSHOptions"
        last_used_at:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Milliseconds since epoch the key was last used, if ever"
          example: 1672531200000
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AddedPublicKey:
      type: "object"
      required:
        - "id"
        - "public_key"
      properties:
        id:
          type: "integer"
          format: "int64"
          example: 35
        public_key:
          oneOf:
            - type: "string"
              example: "ssh-rsa AAA[...]xv macno@laptop"
            - type: "object"
              description: "When the key was sent with its signature"
              required:
                - "key"
                - "signature"
              properties:
                key:
                  type: "string"
                signature:
                  type: "string"
    AddedKeysResponse:
      type: "object"
      required:
        - "account_id"
        - "public_keys"
      properties:
        account_id:
          type: "integer"
          format: "int64"
          example: 251
        public_keys:
          type: "array"
          items:
            $ref: "#/components/schemas/AddedPublicKey"
    PermissionNew:
      type: "object"
      required:
        - "user"
        - "host"
      properties:
        user:
          description: "Remote user, % is a wildcard"
          type: "string"
          example: "root"
        host:
          description: "Host, % is a wildcard"
          type: "string"
          example: "%.example.com"
        ssh_options:
          $ref: "#/components/schemas/SSHOptions"
    Permission:
      type: "object"
      required:
        - "id"
        - "user"
        - "host"
        - "ssh_options"
        - "created_at"
      properties:
        id:
          type: "integer"
          format: "int64"
          example: 435
        user:
          type: "string"
          example: "root"
        host:
          type: "string"
          example: "%.example.com"
        ssh_options:
          $ref: "#/components/schemas/StoredSSHOptions"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AccountPermission:
      allOf:
        - $ref: "#/components/schemas/Permission"
        - type: "object"
          properties:
            is_internal:
              description: "true when the permission belongs to the account's own group"
              type: "boolean"
            from_group:
              $ref: "#/components/schemas/AccountGroup"
    Dump:
      type: "object"
      properties:
        accounts:
          type: "array"
          items:
            $ref: "#/components/schemas/Account"
        groups:
          type: "array"
          items:
            $ref: "#/components/schemas/Group"
    ErrorResponse:
      type: "object"
      required:
        - "status"
        - "reason"
      properties:
        status:
          type: "integer"
          format: "int32"
          example: 500
        reason:
          type: "string"
          example: "Internal Server Error"
    CodeErrorResponse:
      type: "object"
      required:
        - "code"
        - "reason"
      properties:
        code:
          type: "integer"
          format: "int32"
          example: 400
        reason:
          type: "string"
          example: "Invalid payload"
    NotFoundErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: "object"
          properties:
            status:
              example: 404
            reason:
              example: "Item not found"
    InvalidPayloadErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: "object"
          properties:
            status:
              example: 400
            reason:
              example: "Invalid payload"
    UnauthorizedErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: "object"
          properties:
            status:
              example: 401
            reason:
              example: "Unauthorized"
    ForbiddenErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: "object"
          properties:
            status:
              example: 403
            reason:
              example: "Operation is forbidden"
externalDocs:
  description: "Find out more about Theo"
  url: "https://github.com/theoapp/"
