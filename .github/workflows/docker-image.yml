name: release to docker hub

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22'
      - name: Log into registry
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: build image and push
        run: ./scripts/buildDockerImages.sh all push
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE_NAME }}
      - name: call AK webhook
        run: |
          # Strip git ref prefix from version
          VERSION=$(npm run -s ver)
          LATEST_TAG=$(git tag | grep -E '^[0-9]*\.[0-9]*\.[0-9]*$' | sort --version-sort | tail -n 1)
          if [ "$LATEST_TAG" = "$DOCKER_TAG" ]; then
            LATEST=true
          else
            LATEST=false
          fi
          if [ -n "${{ secrets.THEO_UPDATE_TOKEN }}" ]; then
            curl --fail -s -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.THEO_UPDATE_TOKEN }}" \
              -d '{"code": "'$VERSION'", "latest": '${LATEST}' }' https://update.theo.authkeys.io/version
          fi
