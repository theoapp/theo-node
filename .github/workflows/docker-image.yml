name: release to docker hub

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build image and push
        run: ./scripts/buildDockerImages.sh all push
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE_NAME }}
          DOCKER_PLATFORMS: linux/amd64,linux/arm64
      - name: call AK webhook
        run: |
          # Strip git ref prefix from version
          VERSION=$(npm run -s ver)
          LATEST_TAG=$(git tag | grep -E '^[0-9]*\.[0-9]*\.[0-9]*$' | sort --version-sort | tail -n 1)
          if [ "$LATEST_TAG" = "$VERSION" ]; then
            LATEST=true
          else
            LATEST=false
          fi
          if [ -n "${{ secrets.THEO_UPDATE_TOKEN }}" ]; then
            curl --fail -s -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.THEO_UPDATE_TOKEN }}" \
              -d '{"code": "'$VERSION'", "latest": '${LATEST}' }' https://update.theo.authkeys.io/version
          fi
