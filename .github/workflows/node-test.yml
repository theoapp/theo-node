name: Node.js CI test

on:
  push:
    branches:
      - '*'

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22'
      - run: npm ci
      - run: npm run lint
      - run: npm run build --if-present
      - run: npm run test:standalone
