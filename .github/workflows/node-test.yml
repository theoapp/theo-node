name: Node.js CI test

on:
  push:
    branches:
      - '*'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.16'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.16'
      - run: npm ci --no-optional
      - run: npm run test:standalone

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.16'
      - run: npm ci --no-optional
      - run: npm run build --if-present
